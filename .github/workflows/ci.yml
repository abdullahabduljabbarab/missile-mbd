# Simulink missile CI. Loads the model, runs the smoke sim + any Test
# Manager cases, regenerates the traceability report, and uploads
# everything under ci_artifacts/. Code generation (slbuild) is optional
# on hosted runners: the script probes for a Simulink Coder / Embedded
# Coder licence before attempting slbuild and cleanly skips otherwise.
#
# Simulink and Simulink Test are covered by MathWorks' free hosted-CI
# batch tokens for public repos. Coder-family products (Simulink Coder,
# MATLAB Coder, Embedded Coder) require paid licences that hosted
# runners don't get, so we don't ask for them here - codegen still runs
# locally with a full toolchain and on a licensed MATLAB Server.
#
# Trigger: manual dispatch only.

name: CI

on:
  workflow_dispatch:

jobs:
  model-tests:
    name: Model tests + optional codegen
    # windows-2022 pins Visual Studio 2022 as the C++ baseline so any
    # codegen that DOES run (on a licensed self-hosted runner) matches
    # the CLEARANCE-side toolchain.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2026a
          products: >
            Simulink
            Simulink_Test

      - name: Run model tests + build script
        uses: matlab-actions/run-command@v2
        with:
          command: >
            addpath(genpath(pwd));
            cd('tools');
            run_model_tests_and_build;

      - name: Upload sim + verification artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: missile-sim-artefacts
          path: |
            ci_artifacts/
            traceability_report.csv
            traceability_report.html
            req_map.csv
            slprj/
          if-no-files-found: warn
