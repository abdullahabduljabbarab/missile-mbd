# Simulink missile CI. Loads the model, runs the smoke sim + any
# Test Manager cases, attempts code generation via rtwbuild (the
# script tolerates a licence-checkout failure so the run stays green
# on free GitHub-hosted runners), regenerates the traceability
# report, and uploads everything under ci_artifacts/.
#
# Simulink and Simulink Test licences are covered by the free
# matlab-actions/setup-matlab@v2 batch tokens; Simulink Coder / MATLAB
# Coder / Embedded Coder are not, so the codegen portion is
# best-effort on public runners and green-guaranteed on a licensed
# MATLAB Server.
#
# Trigger: manual dispatch only, matching the CLEARANCE-side pipeline.

name: CI

on:
  workflow_dispatch:

jobs:
  model-tests-and-codegen:
    name: Model tests + Embedded Coder codegen
    # Pin BOTH the runner AND the MATLAB release so the toolchain match works:
    # - windows-2022 ships Visual Studio 2022 as its C++ baseline
    # - MATLAB R2026a (pinned below) loads the model and knows the VS 2022 toolchain
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MATLAB (retries setup-matlab in case MathWorks batch tokens flake on first-time provisioning)
        uses: Wandalen/wretry.action@v3
        with:
          action: matlab-actions/setup-matlab@v2
          with: |
            release: R2026a
            products: >
              Simulink
              Simulink_Test
              Embedded_Coder
              MATLAB_Coder
              Simulink_Coder
          attempt_limit: 5
          attempt_delay: 60000

      - name: Run model tests + build script
        uses: matlab-actions/run-command@v2
        with:
          command: >
            addpath(genpath(pwd));
            cd('tools');
            run_model_tests_and_build;
            exit(0);

      - name: Upload sim + verification artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: missile-sim-artefacts
          path: |
            ci_artifacts/
            traceability_report.csv
            traceability_report.html
            req_map.csv
            slprj/
          if-no-files-found: warn
